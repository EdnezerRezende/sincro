# Overlay de sandbox/produção: aplicado por cima de docker-compose.yml via
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d --build
# Garante restart automático e expõe as portas só em loopback (127.0.0.1), já que o Caddy
# (fora deste compose) é quem fala com o mundo externo. `ports:` do Compose faz merge por
# concatenação, não substituição — por isso o Postgres usa `!reset` (nenhuma porta publicada:
# só o backend fala com ele, via rede interna do Docker) e backend/mobile-web usam `!override`
# (substitui de fato a publicação 0.0.0.0 do docker-compose.yml base pela versão loopback-only).
services:
  postgres:
    restart: always
    ports: !reset null

  backend:
    restart: always
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production

  mobile-web:
    restart: always
    ports: !override
      - "127.0.0.1:8080:80"
