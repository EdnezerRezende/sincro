server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Local docker-compose only (no Caddy in front, e.g. `docker compose up` without the
    # sandbox overlay): the Flutter web bundle is built with API_BASE_URL=/api (see
    # Dockerfile.web), so it emits requests like "/api/users/me" against this container's own
    # origin. Forward those to the `backend` service on the internal Docker network
    # (docker-compose.yml), stripping the /api prefix so the path matches Nest's bare routes
    # (e.g. /api/users/me -> /users/me) — mirroring exactly what infra/Caddyfile does for the
    # sandbox/production domain in front of this same image. In the sandbox, Caddy intercepts
    # /api/* before it ever reaches this container, so this block is inert there.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
